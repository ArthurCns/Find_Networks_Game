<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon compte · Terminus</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20120%20120%22%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%22116%22%20height%3D%22116%22%20rx%3D%2226%22%20fill%3D%22%23FFDE21%22%20stroke%3D%22%230A0A0A%22%20stroke-width%3D%224%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2250%22%20width%3D%2266%22%20height%3D%2212%22%20rx%3D%226%22%20fill%3D%22%230A0A0A%22%2F%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2256%22%20r%3D%2210%22%20fill%3D%22%230A0A0A%22%2F%3E%3Ccircle%20cx%3D%2282%22%20cy%3D%2256%22%20r%3D%2221%22%20fill%3D%22%23FFFFFF%22%20stroke%3D%22%230A0A0A%22%20stroke-width%3D%226%22%2F%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="brand/png/terminus-icone-jaune-180.png">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script defer src="auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend+Mega:wght@400;500;600;700;800&family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8e0;
    --surface:#ffffff;
    --surface-2:#fff3b0;
    --ink:#0a0a0a;
    --muted:#5c5c52;
    --line:#ecE6c8;
    --border:var(--ink);
    --accent:#FFDE21;
    --accent-ink:#0a0a0a;
    --accent-2:#3b5bfd;
    --map-bg:#fff8e0;
    --pin:#FFDE21;
    --target:#3b5bfd;
    --success:#1fa855;
    --warn:#f59e0b;
    --danger:#ef4444;
    --shadow: 5px 5px 0 var(--border);
    --shadow-sm: 3px 3px 0 var(--border);
    --bw: 3px;
    --ease-out: cubic-bezier(.23,1,.32,1);
    --ease-in-out: cubic-bezier(.77,0,.175,1);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141414;
      --surface:#1d1d1a;
      --surface-2:#2a2a1a;
      --ink:#f6f4e8;
      --muted:#a9a698;
      --line:#33332a;
      --accent:#FFDE21;
      --accent-ink:#0a0a0a;
      --accent-2:#7d95ff;
      --map-bg:#141414;
      --pin:#FFDE21;
      --target:#7d95ff;
      --success:#3ddc7c;
      --warn:#fbbf24;
      --danger:#f87171;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141414;
    --surface:#1d1d1a;
    --surface-2:#2a2a1a;
    --ink:#f6f4e8;
    --muted:#a9a698;
    --line:#33332a;
    --accent:#FFDE21;
    --accent-ink:#0a0a0a;
    --accent-2:#7d95ff;
    --map-bg:#141414;
    --pin:#FFDE21;
    --target:#7d95ff;
    --success:#3ddc7c;
    --warn:#fbbf24;
    --danger:#f87171;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Public Sans",system-ui,sans-serif;
    padding-inline:16px;
    padding-block:20px;
    display:flex;
    justify-content:center;
  }
  img{ max-width:100%; }
  /* ---------- site navigation (left rail) ---------- */
  body{ padding-left:230px; }
  .site-nav{
    position:fixed; top:0; left:0; bottom:0; width:214px; z-index:40;
    display:flex; flex-direction:column; align-items:stretch; gap:6px;
    padding:20px 12px;
    background:var(--surface);
    border-right:var(--bw) solid var(--border);
  }
  .nav-item{
    display:flex; flex-direction:row; align-items:center; justify-content:flex-start; gap:10px;
    width:100%; padding:9px 12px;
    border-radius:9px; text-decoration:none;
    border:var(--bw) solid transparent;
    color:var(--ink);
    font-family:"Public Sans",system-ui,sans-serif; font-weight:800;
    font-size:.92rem; letter-spacing:.02em; text-transform:uppercase;
    transition:background-color 160ms var(--ease-out), border-color 160ms var(--ease-out), box-shadow 160ms var(--ease-out), transform 160ms var(--ease-out);
  }
  .nav-item svg{ width:20px; height:20px; flex:none; display:block; }
  .nav-item span{ white-space:nowrap; }
  .nav-item:hover{ background:var(--surface-2); border-color:var(--border); }
  .nav-item:active{ transform:translate(2px,2px); }
  .nav-item.is-active{ background:var(--accent); color:var(--accent-ink); border-color:var(--border); box-shadow:var(--shadow-sm); }
  .nav-item.is-active:hover{ background:var(--accent); }
  .nav-item:focus-visible{ outline:3px solid var(--accent-2); outline-offset:2px; }
  @media (max-width:700px){
    body{ padding-left:16px; padding-bottom:88px; }
    .nav-item span{ white-space:normal; }
    .site-nav{
      top:auto; right:0; width:auto; height:68px;
      flex-direction:row; justify-content:center; align-items:center;
      padding:6px 12px; border-right:none; border-top:var(--bw) solid var(--border);
    }
    .nav-item{ width:auto; }
  }
  .nav-menu-label{
    font-family:"Public Sans",system-ui,sans-serif; font-weight:900;
    font-size:.86rem; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink); padding:2px 12px 10px; margin-bottom:6px;
    border-bottom:var(--bw) solid var(--accent);
  }
  /* ---------- brand (Terminus logo, see brand/ and design.md) ---------- */
  .nav-brand{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:6px 8px 16px; margin-bottom:10px; text-decoration:none; color:var(--ink);
    border-radius:11px;
  }
  .nav-brand:focus-visible{ outline:3px solid var(--accent-2); outline-offset:2px; }
  .brand-symbol{ width:118px; height:auto; display:block; overflow:visible; transition:transform 200ms var(--ease-out); }
  .nav-brand:hover .brand-symbol{ transform:translateX(3px); }
  .bs-bar{ fill:var(--ink); }
  .bs-stop{ fill:var(--surface); stroke:var(--ink); stroke-width:4; }
  .bs-shadow{ fill:var(--ink); }
  .bs-end{ fill:var(--accent); stroke:var(--ink); stroke-width:5; }
  .brand-word{
    font-family:"Lexend Mega",system-ui,sans-serif; font-weight:800;
    font-size:1.32rem; letter-spacing:-.05em; line-height:1; color:var(--ink);
  }
  .brand-tagline{
    font-family:"Public Sans",system-ui,sans-serif; font-weight:900;
    font-size:.6rem; letter-spacing:.12em; text-transform:uppercase; white-space:nowrap; color:var(--accent-2);
  }
  @media (max-width:700px){ .nav-brand{ display:none; } }
  @media (prefers-reduced-motion: reduce){ .nav-brand:hover .brand-symbol{ transform:none; } }
  /* ---------- accounts: link buttons, nav account + legal links ---------- */
  a.btn-primary, a.btn-ghost{
    display:inline-flex; align-items:center; justify-content:center; text-align:center; text-decoration:none;
    font-family:"Public Sans",system-ui,sans-serif; font-weight:800; letter-spacing:.02em; text-transform:uppercase; font-size:.95rem;
    border-radius:9px; border:var(--bw) solid var(--border); padding:.65em 1.3em; box-shadow:var(--shadow-sm);
    transition:transform 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
  }
  a.btn-primary:hover, a.btn-ghost:hover{ transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--border); }
  a.btn-primary:active, a.btn-ghost:active{ transform:translate(2px,2px); box-shadow:0 0 0 var(--border); }
  a.btn-primary:focus-visible, a.btn-ghost:focus-visible{ outline:3px solid var(--accent-2); outline-offset:2px; }
  .map-gate-overlay a.btn-primary, .map-gate-overlay a.btn-ghost{ width:100%; }
  .gate-note{ font-size:.8rem; color:var(--muted); line-height:1.35; }
  #nav-account-label{ overflow:hidden; text-overflow:ellipsis; }
  .nav-legal{ display:flex; flex-wrap:wrap; gap:2px 10px; padding:10px 12px 0; }
  .nav-legal a{ font-size:.7rem; font-weight:600; color:var(--muted); text-decoration:none; }
  .nav-legal a:hover{ color:var(--ink); text-decoration:underline; }
  @media (max-width:700px){
    .nav-legal{ display:none; }
    .nav-theme-btn span{ display:none; }
    .nav-item{ padding:9px 8px; gap:6px; }
  }
  .nav-group summary{ list-style:none; cursor:pointer; }
  .nav-group summary::-webkit-details-marker{ display:none; }
  .nav-group-summary{ justify-content:flex-start; }
  .nav-chevron{ width:16px; height:16px; margin-left:auto; flex:none; transition:transform 160ms var(--ease-out); }
  .nav-group[open] .nav-chevron{ transform:rotate(90deg); }
  .nav-submenu{ display:flex; flex-direction:column; gap:2px; padding:2px 0 6px 12px; }
  .nav-sublabel{
    font-family:"Public Sans",sans-serif; font-weight:800; font-size:.7rem; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); padding:6px 10px 2px;
  }
  .nav-item-city{ padding:6px 10px; font-size:.85rem; font-weight:700; }
  .nav-item-city.is-active{ background:var(--accent); color:var(--accent-ink); border-color:var(--border); box-shadow:var(--shadow-sm); }
  .nav-spacer{ flex:1 1 auto; }
  .nav-theme-btn{ background:transparent; border:var(--bw) solid transparent; }
  .nav-theme-btn:hover{ border-color:var(--border); background:var(--surface-2); }
  .theme-ico-moon{ display:none; }
  :root[data-theme="dark"] .theme-ico-sun{ display:none; }
  :root[data-theme="dark"] .theme-ico-moon{ display:block; }
  @media (max-width:700px){
    .nav-menu-label, .nav-spacer{ display:none; }
    .nav-group{ position:relative; }
    .nav-submenu{
      position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
      background:var(--surface); border:var(--bw) solid var(--border); border-radius:11px;
      box-shadow:var(--shadow); padding:8px; min-width:160px; z-index:50;
    }
  }
  .app{
    width:100%;
    max-width:1280px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  h1,h2,h3{
    font-family:"Lexend Mega",system-ui,sans-serif;
    font-weight:700;
    text-wrap:balance;
    letter-spacing:-.01em;
    margin:0;
  }
  .label{
    font-family:"Public Sans",system-ui,sans-serif;
    font-weight:800;
    letter-spacing:.05em;
    text-transform:uppercase;
    font-size:.76rem;
    color:var(--muted);
  }
  .tnum{ font-variant-numeric:tabular-nums; }
  button{
    font-family:"Public Sans",system-ui,sans-serif;
    font-weight:800;
    letter-spacing:.02em;
    text-transform:uppercase;
    font-size:.95rem;
    cursor:pointer;
    border-radius:9px;
    border:var(--bw) solid var(--border);
    background:var(--surface);
    color:var(--ink);
    padding:.65em 1.3em;
    box-shadow:var(--shadow-sm);
    transition:transform 140ms var(--ease-out), box-shadow 140ms var(--ease-out), filter 120ms ease;
  }
  button:hover{ transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--border); }
  button:active{ transform:translate(2px,2px); box-shadow:0 0 0 var(--border); }
  button:focus-visible, input:focus-visible, .pill:focus-visible{
    outline:3px solid var(--accent-2);
    outline-offset:2px;
  }
  .btn-primary{
    background:var(--accent);
    color:var(--accent-ink);
  }
  .btn-primary:hover{ filter:brightness(1.02); }
  .btn-primary:disabled{ opacity:.45; cursor:not-allowed; box-shadow:var(--shadow-sm); transform:none; }
  .btn-ghost{
    background:var(--surface);
    color:var(--ink);
  }
  .btn-ghost:hover{ background:var(--surface-2); }

  input[type="text"]{
    font-family:"Public Sans",sans-serif;
    font-weight:600;
    font-size:1.05rem;
    padding:.65em .9em;
    border-radius:9px;
    border:var(--bw) solid var(--border);
    background:var(--surface);
    color:var(--ink);
    width:100%;
    transition:box-shadow 160ms var(--ease-out);
  }
  input[type="text"]:focus-visible{ box-shadow:var(--shadow-sm); }

  .card{
    background:var(--surface);
    border:var(--bw) solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:20px;
  }

  header.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand h1{ font-size:1.5rem; letter-spacing:-.01em; }
  .brand .tag{ color:var(--muted); font-size:.85rem; font-weight:600; }

  .stat-row{ display:flex; gap:18px; flex-wrap:wrap; }
  .stat{ display:flex; flex-direction:column; gap:2px; min-width:64px; }
  .stat .v{ font-size:1.4rem; font-weight:700; font-family:"Lexend Mega",sans-serif; }

  .rules{ display:flex; flex-direction:column; gap:6px; color:var(--muted); font-size:.88rem; line-height:1.5;}
  .rules b{ color:var(--ink); }

  table.board{ width:100%; border-collapse:collapse; font-size:.92rem; }
  table.board th{ text-align:left; color:var(--muted); font-weight:800; font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; padding-bottom:6px; border-bottom:2px solid var(--ink);}
  table.board td{ padding:8px 4px; border-bottom:1px solid var(--line); font-weight:600; }
  table.board tr:last-child td{ border-bottom:none; }
  table.board td.rank{ color:var(--muted); width:1.6em; }
  .empty-board{ color:var(--muted); font-size:.9rem; padding:8px 0; }

  /* ---------- play screen ---------- */
  .prompt-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .prompt-target{ display:flex; flex-direction:column; gap:2px; }
  .prompt-target .network{ font-size:1.4rem; font-family:"Lexend Mega",sans-serif; font-weight:700; }
  .timerwrap{ flex:1; min-width:160px; max-width:280px; }
  .timerbar{ height:10px; border-radius:5px; background:var(--surface-2); overflow:hidden; border:2px solid var(--border); }
  .timerbar > i{ display:block; height:100%; background:var(--accent); width:100%; transform-origin:left; transition:width .1s linear, background-color 200ms ease; }

  .map-wrap{ position:relative; border-radius:14px; overflow:hidden; background:var(--map-bg); border:var(--bw) solid var(--border); box-shadow:var(--shadow); }
  .map-card{ padding:0; overflow:hidden; }
  .map-card-head{ padding:16px 18px; border-bottom:var(--bw) solid var(--border); display:flex; flex-direction:column; gap:12px; }
  .map-card .map-wrap{ border:none; border-radius:0; box-shadow:none; }
  .map-wrap.inactive svg.map{ cursor:default; opacity:.55; }
  .map-gate-overlay{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(1);
    display:flex; flex-direction:column; align-items:center; gap:10px;
    width:min(300px, 84%);
    background:var(--surface);
    border:var(--bw) solid var(--border);
    border-radius:14px;
    box-shadow:6px 6px 0 var(--border);
    padding:22px 24px;
    text-align:center;
    animation:mk-modal-in 220ms var(--ease-out) both;
  }
  .map-gate-overlay .network{ font-size:1.25rem; font-family:"Lexend Mega",sans-serif; }
  .map-gate-overlay input{ text-align:center; }
  .map-gate-overlay button{ width:100%; }
  @keyframes mk-modal-in{ from{ opacity:0; transform:translate(-50%,-50%) scale(.96); } to{ opacity:1; transform:translate(-50%,-50%) scale(1); } }

  .map-score-points{
    position:absolute; top:14px; right:14px;
    font-family:"Lexend Mega",sans-serif; font-weight:700;
    font-size:1.7rem; line-height:1;
    padding:.2em .5em;
    border-radius:9px;
    background:var(--surface);
    border:var(--bw) solid var(--border);
    box-shadow:var(--shadow-sm);
    animation:mk-pop-in 220ms var(--ease-out) both;
  }
  .map-score-points.success{ color:var(--success); }
  .map-score-points.warn{ color:var(--warn); }
  .map-score-points.danger{ color:var(--danger); }

  .reaction-toast{
    position:absolute; top:14px; left:14px; z-index:5;
    display:flex; align-items:center; gap:12px;
    max-width:min(300px, calc(100% - 130px));
    padding:10px 16px 10px 12px;
    background:var(--surface);
    border:var(--bw) solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow-sm);
    animation:rx-pop 260ms var(--ease-out) both;
    pointer-events:none;
  }
  .reaction-toast.success{ border-color:var(--success); }
  .reaction-toast.warn{ border-color:var(--warn); }
  .reaction-toast.danger{ border-color:var(--danger); }
  .rx-media{ flex:none; width:64px; height:64px; display:flex; align-items:center; justify-content:center; }
  .rx-media img{ width:64px; height:64px; object-fit:cover; border-radius:10px; }
  .rx-emoji{ font-size:3rem; line-height:1; display:inline-block; animation:rx-wiggle 1s ease-in-out infinite; }
  .rx-text{ display:flex; flex-direction:column; gap:2px; }
  .rx-title{ font-family:"Lexend Mega",sans-serif; font-weight:700; font-size:1.05rem; text-transform:uppercase; letter-spacing:.01em; }
  .reaction-toast.success .rx-title{ color:var(--success); }
  .reaction-toast.warn .rx-title{ color:var(--warn); }
  .reaction-toast.danger .rx-title{ color:var(--danger); }
  .rx-caption{ font-size:.9rem; line-height:1.3; font-weight:600; }
  @keyframes rx-pop{ from{ opacity:0; transform:translateY(-10px) scale(.94); } to{ opacity:1; transform:none; } }
  @keyframes rx-wiggle{ 0%,100%{ transform:rotate(-8deg) scale(1); } 50%{ transform:rotate(8deg) scale(1.12); } }
  @keyframes mk-pop-in{ from{ opacity:0; transform:scale(.9); } to{ opacity:1; transform:scale(1); } }
  @media (prefers-reduced-motion: reduce){ .reaction-toast, .rx-emoji, .map-gate-overlay, .map-score-points{ animation:none; } }
  .map-fs-btn{
    position:absolute; right:12px; bottom:12px; z-index:6;
    width:38px; height:38px; padding:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface); color:var(--ink);
    border:var(--bw) solid var(--border); border-radius:9px;
    box-shadow:var(--shadow-sm);
    opacity:1;
    transition:transform 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
  }
  .map-fs-btn:hover{ transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--border); }
  .map-fs-btn:active{ transform:translate(2px,2px); box-shadow:0 0 0 var(--border); }
  .map-fs-btn svg{ width:18px; height:18px; display:block; }
  .fs-ico-off{ display:none !important; }
  #app:fullscreen .fs-ico-on{ display:none !important; }
  #app:fullscreen .fs-ico-off{ display:block !important; }
  #app:-webkit-full-screen .fs-ico-on{ display:none !important; }
  #app:-webkit-full-screen .fs-ico-off{ display:block !important; }
  #app:fullscreen{ max-width:none; width:100%; padding:16px; overflow:auto; background:var(--bg); }
  #app:-webkit-full-screen{ max-width:none; width:100%; padding:16px; overflow:auto; background:var(--bg); }
  #app:fullscreen .map-wrap{ width:min(100%, calc((100vh - 280px) * 1.04)); margin-inline:auto; }
  #app:-webkit-full-screen .map-wrap{ width:min(100%, calc((100vh - 280px) * 1.04)); margin-inline:auto; }
  .game-grid{ display:grid; grid-template-columns:1fr 340px; gap:16px; align-items:start; }
  .game-main{ display:flex; flex-direction:column; gap:14px; min-width:0; }
  .recap-card{ padding:16px; }
  .recap-total{ font-family:"Lexend Mega",sans-serif; font-weight:700; font-size:1.4rem; color:var(--ink); }
  .recap-total small{ font-size:.75rem; color:var(--muted); font-weight:700; }
  .recap-list{ list-style:none; margin:0; padding:0; }
  .recap-list li{ display:grid; grid-template-columns:1.4em 1fr auto auto; gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:.88rem; font-weight:600; opacity:0; transform:translateY(6px); animation:mk-fade 280ms var(--ease-out) forwards; }
  .recap-list li:last-child{ border-bottom:none; }
  .recap-list li:nth-last-child(1){ animation-delay:0ms; }
  .recap-list li:nth-last-child(2){ animation-delay:30ms; }
  .recap-list li:nth-last-child(3){ animation-delay:60ms; }
  .rc-n{ color:var(--muted); }
  .rc-name b{ font-weight:700; }
  .rc-name i{ display:block; font-style:normal; color:var(--muted); font-size:.76rem; font-weight:600; }
  .rc-km{ color:var(--muted); font-size:.8rem; }
  .rc-pts{ font-size:.8rem; min-width:3.2em; text-align:center; }
  .recap-next{ margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-weight:700; }  .game-aside{ min-width:0; display:flex; flex-direction:column; gap:14px; position:sticky; top:16px; }
  .game-aside .result-panel{ flex-direction:column; align-items:stretch; gap:14px; padding:16px; }
  .game-aside .result-metrics{ display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }

    if(err && err.status === 429 || m.indexOf("rate limit") >= 0) return "Trop de tentatives. Réessaie dans quelques minutes.";
    if(m.indexOf("invalid login") >= 0) return "E-mail ou mot de passe incorrect.";
    if(m.indexOf("email not confirmed") >= 0) return "Confirme d'abord ton adresse e-mail (pense à regarder dans les indésirables).";
    if(code === "user_already_exists" || m.indexOf("already registered") >= 0) return "Un compte existe déjà avec cette adresse : connecte-toi.";
    if(m.indexOf("database error saving new user") >= 0) return "Ce pseudo n'est plus disponible : choisis-en un autre.";
    if(code === "23505" || m.indexOf("duplicate") >= 0) return "Ce pseudo est déjà pris.";
    if(m.indexOf("réservé") >= 0) return "Ce pseudo est réservé.";
    if(m.indexOf("should be different") >= 0) return "Le nouveau mot de passe doit être différent de l'ancien.";
    if(m.indexOf("weak") >= 0 || m.indexOf("pwned") >= 0 || m.indexOf("leaked") >= 0) return "Mot de passe trop faible ou déjà divulgué : choisis-en un autre.";
    if(m.indexOf("password") >= 0 && m.indexOf("at least") >= 0) return "Mot de passe trop court (8 caractères minimum).";
    if(m.indexOf("email") >= 0 && m.indexOf("invalid") >= 0) return "Adresse e-mail invalide.";
    return "Une erreur est survenue. Réessaie dans un instant.";
  }

  function flashHtml(){
    if(!flash) return "";
    var h = '<div class="flash' + (flash.type === "err" ? " err" : "") + '" role="status">' + esc(flash.text) + '</div>';
    flash = null;
    return h;
  }

  // ---------------- views ----------------
  function render(){
    lastKey = st.status + "|" + (st.pseudo || "") + "|" + view;
    if(view === "deleted"){
      box.innerHTML = '<section class="acct-card"><h2>Compte supprimé</h2>' +
        '<p>Ton compte, ton pseudo et tous tes scores ont été effacés. Merci d’avoir joué !</p>' +
        '<div class="acct-row"><a class="btn-primary" href="index.html">Retour à l’accueil</a></div></section>';
      return;
    }
    if(st.status === "loading"){ box.innerHTML = '<section class="acct-card"><p>Chargement…</p></section>'; return; }
    if(st.status === "unavailable"){
      box.innerHTML = '<section class="acct-card"><h2>Service indisponible</h2><p>Les comptes ne peuvent pas être chargés pour le moment (connexion ou bloqueur de scripts ?). Réessaie plus tard.</p></section>';
      return;
    }
    if(view === "recovery") return renderRecovery();
    if(st.status === "user") return renderAccount();
    if(view === "sent") return renderSent();
    if(view === "forgot") return renderForgot();
    renderAuthForms();
  }

  function tabsHtml(){
    return '<div class="acct-tabs" role="tablist">' +
      '<button type="button" role="tab" id="tab-signup" aria-selected="' + (view === "signup") + '">Créer un compte</button>' +
      '<button type="button" role="tab" id="tab-login" aria-selected="' + (view === "login") + '">Se connecter</button>' +
    '</div>';
  }

  function renderAuthForms(){
    if(view !== "login") view = "signup";
    var form = view === "signup" ?
      '<form id="f-signup" novalidate>' +
        '<label class="field">Pseudo<input type="text" id="su-pseudo" maxlength="18" autocomplete="nickname" required></label>' +
        '<p class="field-hint" id="su-pseudo-hint">3 à 18 caractères, unique. Il sera visible dans les classements : évite ton vrai nom.</p>' +
        '<label class="field">Adresse e-mail<input type="email" id="su-email" autocomplete="email" required></label>' +
        '<label class="field">Mot de passe<input type="password" id="su-pass" minlength="8" autocomplete="new-password" required></label>' +
        '<p class="field-hint">8 caractères minimum.</p>' +
        '<label class="check"><input type="checkbox" id="su-age"> <span>J’ai 15 ans ou plus, ou j’ai l’accord d’un parent (ou de mon représentant légal) pour créer ce compte.</span></label>' +
        '<label class="check"><input type="checkbox" id="su-cgu"> <span>J’accepte les <a href="cgu.html" target="_blank" rel="noopener">conditions d’utilisation</a> et j’ai lu la <a href="confidentialite.html" target="_blank" rel="noopener">politique de confidentialité</a>.</span></label>' +
        '<button class="btn-primary" type="submit" id="su-btn">Créer mon compte</button>' +
        '<p class="form-msg err" id="su-msg" role="alert"></p>' +
      '</form>'
    :
      '<form id="f-login" novalidate>' +
        '<label class="field">Adresse e-mail<input type="email" id="li-email" autocomplete="email" required></label>' +
        '<label class="field">Mot de passe<input type="password" id="li-pass" autocomplete="current-password" required></label>' +
        '<button class="btn-primary" type="submit" id="li-btn">Se connecter</button>' +
        '<p class="form-msg err" id="li-msg" role="alert"></p>' +
        '<button type="button" class="link-btn" id="li-forgot">Mot de passe oublié ?</button>' +
      '</form>';
    box.innerHTML = flashHtml() + '<section class="acct-card">' + tabsHtml() + form + '</section>' + footHtml();
    $("tab-signup").addEventListener("click", function(){ view = "signup"; render(); });
    $("tab-login").addEventListener("click", function(){ view = "login"; render(); });
    if(view === "signup") bindSignup(); else bindLogin();
  }

  function footHtml(){
    return '<p class="acct-foot">Tes données : <a href="confidentialite.html">politique de confidentialité</a> · <a href="cgu.html">CGU</a> · <a href="mentions-legales.html">mentions légales</a>.</p>';
  }

  // live pseudo check (format, then availability on the server)
  function bindPseudoCheck(input, hint, current, onState){
    var timer = null, seq = 0;
    function setHint(text, cls){ hint.textContent = text; hint.className = "field-hint" + (cls ? " " + cls : ""); }
    input.addEventListener("input", function(){
      clearTimeout(timer);
      var p = input.value.trim();
      var fmtErr = T.pseudoError(p);
      onState(false);
      if(!p){ setHint("3 à 18 caractères, unique.", ""); return; }
      if(fmtErr){ setHint(fmtErr, "bad"); return; }
      if(current && p.toLowerCase() === current.toLowerCase()){ setHint("C’est déjà ton pseudo.", ""); return; }
      setHint("Vérification…", "");
      var my = ++seq;
      timer = setTimeout(function(){
        T.client.rpc("pseudo_disponible", {p: p}).then(function(r){
          if(my !== seq) return;
          if(r.error){ setHint("Impossible de vérifier pour l’instant.", ""); onState(true); return; }
          if(r.data){ setHint("« " + p + " » est disponible.", "ok"); onState(true); }
          else setHint("« " + p + " » est déjà pris ou réservé.", "bad");
        });
      }, 350);
    });
  }

  function bindSignup(){
    var pseudoOk = false;
    bindPseudoCheck($("su-pseudo"), $("su-pseudo-hint"), null, function(ok){ pseudoOk = ok; });
    $("f-signup").addEventListener("submit", function(e){
      e.preventDefault();
      var msg = $("su-msg"), btn = $("su-btn");
      var pseudo = $("su-pseudo").value.trim();
      var email = $("su-email").value.trim();
      var pass = $("su-pass").value;
      msg.textContent = "";
      var fmtErr = T.pseudoError(pseudo);
      if(fmtErr){ msg.textContent = "Pseudo : " + fmtErr; return; }
      if(!pseudoOk){ msg.textContent = "Choisis un pseudo disponible."; return; }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ msg.textContent = "Adresse e-mail invalide."; return; }
      if(pass.length < 8){ msg.textContent = "Mot de passe trop court (8 caractères minimum)."; return; }
      if(!$("su-age").checked){ msg.textContent = "Il faut avoir 15 ans ou l’accord d’un parent pour créer un compte."; return; }
      if(!$("su-cgu").checked){ msg.textContent = "Merci d’accepter les conditions d’utilisation."; return; }
      btn.disabled = true;
      T.client.auth.signUp({
        email: email, password: pass,
        options: {data: {pseudo: pseudo, cgu_version: T.CGU_VERSION}, emailRedirectTo: redirectUrl()}
      }).then(function(r){
        btn.disabled = false;
        if(r.error){ msg.textContent = errMsg(r.error); return; }
        if(r.data && r.data.session){ justSignedIn = true; return; }   // e-mail confirmation disabled: already signed in
        view = "sent"; render();
      });
    });
  }

  function bindLogin(){
    $("li-forgot").addEventListener("click", function(){ view = "forgot"; render(); });
    $("f-login").addEventListener("submit", function(e){
      e.preventDefault();
      var msg = $("li-msg"), btn = $("li-btn");
      msg.textContent = "";
      btn.disabled = true;
      justSignedIn = true;
      T.client.auth.signInWithPassword({email: $("li-email").value.trim(), password: $("li-pass").value}).then(function(r){
        btn.disabled = false;
        if(r.error){ justSignedIn = false; msg.textContent = errMsg(r.error); }
      });
    });
  }

  function renderSent(){
    box.innerHTML = '<section class="acct-card"><h2>Vérifie ta boîte mail</h2>' +
      '<p>Si cette adresse n’est pas déjà inscrite, tu vas recevoir un lien de confirmation. Clique dessus pour activer ton compte (pense aux indésirables).</p>' +
      '<p>Déjà un compte ? Connecte-toi directement.</p>' +
      '<div class="acct-row"><button type="button" class="btn-ghost" id="to-login">Se connecter</button></div></section>';
    $("to-login").addEventListener("click", function(){ view = "login"; render(); });
  }

  function renderForgot(){
    box.innerHTML = '<section class="acct-card"><h2>Mot de passe oublié</h2>' +
      '<form id="f-forgot" novalidate>' +
        '<label class="field">Adresse e-mail du compte<input type="email" id="fg-email" autocomplete="email" required></label>' +
        '<button class="btn-primary" type="submit" id="fg-btn">Recevoir un lien</button>' +
        '<p class="form-msg" id="fg-msg" role="alert"></p>' +
        '<button type="button" class="link-btn" id="fg-back">Retour à la connexion</button>' +
      '</form></section>';
    $("fg-back").addEventListener("click", function(){ view = "login"; render(); });
    $("f-forgot").addEventListener("submit", function(e){
      e.preventDefault();
      var msg = $("fg-msg"), btn = $("fg-btn");
      btn.disabled = true;
      T.client.auth.resetPasswordForEmail($("fg-email").value.trim(), {redirectTo: pageUrl()}).then(function(r){
        btn.disabled = false;
        if(r.error){ msg.className = "form-msg err"; msg.textContent = errMsg(r.error); return; }
        msg.className = "form-msg ok";
        msg.textContent = "Si un compte existe avec cette adresse, un lien de réinitialisation vient d’être envoyé.";
      });
    });
  }

  function renderRecovery(){
    box.innerHTML = '<section class="acct-card"><h2>Nouveau mot de passe</h2>' +
      '<form id="f-recover" novalidate>' +
        '<label class="field">Nouveau mot de passe<input type="password" id="rc-pass" minlength="8" autocomplete="new-password" required></label>' +
        '<p class="field-hint">8 caractères minimum.</p>' +
        '<button class="btn-primary" type="submit" id="rc-btn">Enregistrer</button>' +
        '<p class="form-msg err" id="rc-msg" role="alert"></p>' +
      '</form></section>';
    $("f-recover").addEventListener("submit", function(e){
      e.preventDefault();
      var pass = $("rc-pass").value, msg = $("rc-msg"), btn = $("rc-btn");
      if(pass.length < 8){ msg.textContent = "Mot de passe trop court (8 caractères minimum)."; return; }
      btn.disabled = true;
      T.client.auth.updateUser({password: pass}).then(function(r){
        btn.disabled = false;
        if(r.error){ msg.textContent = errMsg(r.error); return; }
        view = "signup";
        flash = {type: "ok", text: "Mot de passe modifié."};
        render();
      });
    });
  }

  // ---------------- signed-in dashboard ----------------
  function renderAccount(){
    var u = st.user, p = st.profile || {};
    if(!st.pseudo){
      box.innerHTML = '<section class="acct-card"><h2>Profil introuvable</h2>' +
        '<p>Ton compte existe mais son profil n’a pas pu être chargé. Réessaie plus tard ou contacte l’éditeur (voir les <a href="mentions-legales.html">mentions légales</a>).</p>' +
        '<div class="acct-row"><button type="button" class="btn-ghost" id="ac-out">Se déconnecter</button></div></section>';
      $("ac-out").addEventListener("click", signOut);
      return;
    }
    box.innerHTML = flashHtml() +
      '<section class="acct-card">' +
        '<h2>Salut, ' + esc(st.pseudo) + ' !</h2>' +
        '<dl class="acct-info">' +
          '<dt>Pseudo</dt><dd>' + esc(st.pseudo) + '</dd>' +
          '<dt>E-mail</dt><dd>' + esc(u.email) + '</dd>' +
          '<dt>Membre depuis</dt><dd>' + fmtDate(p.created_at || u.created_at) + '</dd>' +
          '<dt>CGU acceptées</dt><dd>le ' + fmtDate(p.cgu_accepted_at) + ' (version ' + esc(p.cgu_version || "—") + ')</dd>' +
        '</dl>' +
        '<div class="acct-row">' +
          '<a class="btn-primary" href="' + esc(nextUrl || "index.html") + '">' + (nextUrl ? "Reprendre la partie" : "Jouer") + '</a>' +
          '<button type="button" class="btn-ghost" id="ac-out">Se déconnecter</button>' +
        '</div>' +
      '</section>' +
      '<section class="acct-card"><h3>Mes meilleurs scores</h3><div id="ac-scores"><p class="field-hint">Chargement…</p></div></section>' +
      '<section class="acct-card"><h3>Changer de pseudo</h3>' +
        '<form id="f-pseudo" novalidate>' +
          '<label class="field">Nouveau pseudo<input type="text" id="ps-pseudo" maxlength="18" autocomplete="nickname" value="' + esc(st.pseudo) + '"></label>' +
          '<p class="field-hint" id="ps-hint">Tes scores passés suivront ton nouveau pseudo.</p>' +
          '<button class="btn-ghost" type="submit" id="ps-btn">Enregistrer le pseudo</button>' +
          '<p class="form-msg err" id="ps-msg" role="alert"></p>' +
        '</form></section>' +
      '<section class="acct-card"><h3>Changer de mot de passe</h3>' +
        '<form id="f-pass" novalidate>' +
          '<label class="field">Nouveau mot de passe<input type="password" id="pw-pass" minlength="8" autocomplete="new-password"></label>' +
          '<button class="btn-ghost" type="submit" id="pw-btn">Enregistrer le mot de passe</button>' +
          '<p class="form-msg err" id="pw-msg" role="alert"></p>' +
        '</form></section>' +
      '<section class="acct-card"><h3>Mes données</h3>' +
        '<p>Tu peux récupérer toutes les données liées à ton compte (profil et scores) dans un fichier.</p>' +
        '<div class="acct-row"><button type="button" class="btn-ghost" id="ac-export">Télécharger mes données</button></div>' +
        '<p class="form-msg err" id="ex-msg" role="alert"></p>' +
      '</section>' +
      '<section class="acct-card acct-danger"><h3>Supprimer mon compte</h3>' +
        '<p>Ton compte, ton pseudo et <b>tous tes scores</b> seront effacés définitivement. Cette action est irréversible.</p>' +
        '<form id="f-delete" novalidate>' +
          '<label class="field">Pour confirmer, tape ton pseudo<input type="text" id="dl-confirm" autocomplete="off"></label>' +
          '<button class="btn-danger" type="submit" id="dl-btn">Supprimer définitivement</button>' +
          '<p class="form-msg err" id="dl-msg" role="alert"></p>' +
        '</form></section>' +
      footHtml();

    $("ac-out").addEventListener("click", signOut);
    loadScores();

    var pseudoOk = false;
    bindPseudoCheck($("ps-pseudo"), $("ps-hint"), st.pseudo, function(ok){ pseudoOk = ok; });
    $("f-pseudo").addEventListener("submit", function(e){
      e.preventDefault();
      var p = $("ps-pseudo").value.trim(), msg = $("ps-msg"), btn = $("ps-btn");
      msg.textContent = "";
      if(p === st.pseudo) return;
      var fmtErr = T.pseudoError(p);
      if(fmtErr){ msg.textContent = fmtErr; return; }
      if(!pseudoOk){ msg.textContent = "Choisis un pseudo disponible."; return; }
      btn.disabled = true;
      T.client.from("profiles").update({pseudo: p}).eq("id", st.user.id).then(function(r){
        btn.disabled = false;
        if(r.error){ msg.textContent = errMsg(r.error); return; }
        flash = {type: "ok", text: "Pseudo modifié : tu es maintenant « " + p + " »."};
        T.refreshProfile();
      });
    });

    $("f-pass").addEventListener("submit", function(e){
      e.preventDefault();
      var pass = $("pw-pass").value, msg = $("pw-msg"), btn = $("pw-btn");
      msg.className = "form-msg err"; msg.textContent = "";
      if(pass.length < 8){ msg.textContent = "Mot de passe trop court (8 caractères minimum)."; return; }
      btn.disabled = true;
      T.client.auth.updateUser({password: pass}).then(function(r){
        btn.disabled = false;
        if(r.error){ msg.textContent = errMsg(r.error); return; }
        $("pw-pass").value = "";
        msg.className = "form-msg ok"; msg.textContent = "Mot de passe modifié.";
      });
    });

    $("ac-export").addEventListener("click", exportData);

    $("f-delete").addEventListener("submit", function(e){
      e.preventDefault();
      var msg = $("dl-msg"), btn = $("dl-btn");
      msg.textContent = "";
      if($("dl-confirm").value.trim().toLowerCase() !== st.pseudo.toLowerCase()){ msg.textContent = "Le pseudo saisi ne correspond pas."; return; }
      btn.disabled = true;
      T.client.rpc("delete_my_account").then(function(r){
        if(r.error){ btn.disabled = false; msg.textContent = errMsg(r.error); return; }
        view = "deleted";
        T.client.auth.signOut({scope: "local"}).catch(function(){}).then(function(){ render(); });
      });
    });
  }

  function signOut(){
    T.client.auth.signOut().then(function(){ view = "login"; flash = {type: "ok", text: "Tu es déconnecté."}; render(); });
  }

  function fetchMyScores(limit){
    return Promise.all(GAMES.map(function(g){
      return T.client.from(g.table).select("*").eq("user_id", st.user.id)
        .order("score", {ascending: false}).limit(limit)
        .then(function(r){ return {game: g, rows: r.error ? [] : (r.data || []), error: r.error}; });
    }));
  }

  function loadScores(){
    fetchMyScores(10).then(function(res){
      var el = $("ac-scores");
      if(!el) return;
      var rows = [];
      res.forEach(function(x){ x.rows.forEach(function(r){ rows.push({game: x.game.label, city: r.city, score: r.score, date: r.created_at}); }); });
      rows.sort(function(a, b){ return b.score - a.score; });
      rows = rows.slice(0, 10);
      if(!rows.length){ el.innerHTML = '<p class="field-hint">Pas encore de score enregistré. À toi de jouer !</p>'; return; }
      el.innerHTML = '<table class="acct-scores"><thead><tr><th>Jeu</th><th>Date</th><th style="text-align:right">Score</th></tr></thead><tbody>' +
        rows.map(function(r){
          return '<tr><td>' + esc(r.game) + (r.city ? ' · ' + esc(cap(r.city)) : '') + '</td><td>' + fmtDate(r.date) + '</td><td class="tnum">' + fmtNum(r.score) + '</td></tr>';
        }).join("") + '</tbody></table>';
    });
  }

  function exportData(){
    var msg = $("ex-msg");
    msg.textContent = "";
    fetchMyScores(10000).then(function(res){
      var u = st.user, p = st.profile || {};
      var data = {
        exporte_le: new Date().toISOString(),
        site: "Terminus",
        compte: {
          identifiant: u.id,
          pseudo: st.pseudo,
          email: u.email,
          inscrit_le: u.created_at,
          email_confirme_le: u.email_confirmed_at || null,
          derniere_connexion: u.last_sign_in_at || null,
          cgu_version: p.cgu_version || null,
          cgu_acceptees_le: p.cgu_accepted_at || null
        },
        scores: {}
      };
      res.forEach(function(x){ data.scores[x.game.label] = x.rows; });
      var blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "terminus-mes-donnees.json";
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }).catch(function(){ msg.textContent = "Export impossible pour le moment."; });
  }

  // ---------------- wiring ----------------
  function onAuth(s){
    st = s;
    if(s.event === "PASSWORD_RECOVERY") view = "recovery";
    if(s.status === "user" && s.event === "SIGNED_IN" && (justSignedIn || fromEmailLink) && view !== "recovery"){
      justSignedIn = false; fromEmailLink = false;
      if(nextUrl){ location.href = nextUrl; return; }
    }
    if(s.status === "user" && (view === "signup" || view === "login" || view === "sent" || view === "forgot")) view = "account";
    if(s.status === "guest" && view === "account") view = "login";
    var key = s.status + "|" + (s.pseudo || "") + "|" + view;
    if(key !== lastKey || flash) render();   // token refreshes must not wipe what the user is typing
  }

  var started = performance.now();
  (function wait(){
    if(window.TerminusAuth){ T = window.TerminusAuth; T.onChange(onAuth); return; }
    if(performance.now() - started < 6000){ setTimeout(wait, 100); return; }
    st = {status: "unavailable"}; render();
  })();
})();
</script></body></html>
